<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KasLepas - Keuangan Freelancer PDD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bismillah PDD Sukses</h1>
    <p>Catat pemasukan, pengeluaran, dan tagihan klien. untuk PDD</p>
  </header>

  <main>
    <!-- W5: RINGKASAN -->
    <section class="ringkasan">
      <div class="kartu">
        <span>Saldo</span>
        <strong id="saldo">Rp 0</strong>
      </div>
      <div class="kartu">
        <span>Pemasukan</span>
        <strong id="total-pemasukan" class="hijau">Rp 0</strong>
      </div>
      <div class="kartu">
        <span>Pengeluaran</span>
        <strong id="total-pengeluaran" class="merah">Rp 0</strong>
      </div>
      <div class="kartu">
        <span>Piutang klien</span>
        <strong id="total-piutang" class="kuning">Rp 0</strong>
      </div>
    </section>

    <!-- W1 + W6: FORM TAMBAH TRANSAKSI -->
    <section class="kotak">
      <h2>Tambah Transaksi</h2>
      <form id="form-transaksi" novalidate>
        <label>Tanggal
          <input type="date" id="tanggal">
        </label>

        <label>Jenis
          <select id="jenis">
            <option value="pengeluaran">Pengeluaran</option>
            <option value="pemasukan">Pemasukan</option>
          </select>
        </label>

        <!-- Fitur khas freelancer: hanya muncul untuk pemasukan -->
        <label id="baris-status" hidden>Status pembayaran
          <select id="status">
            <option value="lunas">Lunas (uang sudah diterima)</option>
            <option value="belum dibayar">Belum dibayar (tagihan klien)</option>
          </select>
        </label>

        <label>Kategori
          <select id="kategori">
            <option value="">-- Pilih kategori --</option>
          </select>
        </label>

        <label>Nominal (Rp)
          <input type="number" id="nominal" placeholder="0">
        </label>

        <label>Catatan (opsional)
          <input type="text" id="catatan" placeholder="Contoh: Logo PT Maju">
        </label>

        <ul id="pesan-error" class="error"></ul>
        <button type="submit">Simpan</button>
      </form>
    </section>

    <!-- W2 + W3: DAFTAR TRANSAKSI + FILTER -->
    <section class="kotak">
      <h2>Daftar Transaksi</h2>

      <div class="filter">
        <input type="search" id="filter-kata" placeholder="Cari catatan...">
        <select id="filter-jenis">
          <option value="semua">Semua jenis</option>
          <option value="pemasukan">Pemasukan</option>
          <option value="pengeluaran">Pengeluaran</option>
        </select>
        <select id="filter-kategori">
          <option value="semua">Semua kategori</option>
        </select>
      </div>

      <ul id="daftar"></ul>
    </section>

    <!-- BONUS: BACKUP -->
    <section class="kotak">
      <h2>Backup Data</h2>
      <div class="backup">
        <button type="button" id="tombol-ekspor">Ekspor JSON</button>
        <label class="tombol-file">Impor JSON
          <input type="file" id="input-impor" accept=".json,application/json" hidden>
        </label>
      </div>
      <p id="pesan-impor" class="info-kecil"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
